version: "3.9"

services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: echopath-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: echopath
      POSTGRES_USER: echopath
      POSTGRES_PASSWORD: echopath
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echopath -d echopath"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgvector_data:
